<nb-layout [class.auth-layout]="!auth.isAuthenticated()">
  <nb-layout-header *ngIf="auth.isAuthenticated()" fixed>
    <div class="header-bar">
      <div class="header-left">
        <button class="menu-toggle" nbButton ghost type="button" (click)="toggleSidebar()" aria-label="Abrir menu">
          <nb-icon icon="menu-2-outline"></nb-icon>
        </button>
        <button class="brand" type="button" (click)="goToHome()">
          <img src="assets/images/logo_task.png" alt="TaskTrack" class="logo_task">
        </button>
      </div>

      <div class="header-right">
        <button class="notif-btn" nbButton ghost type="button"
          [nbPopover]="notificationsTpl" nbPopoverPlacement="bottom" nbPopoverTrigger="click"
          aria-label="Notificações">
          <nb-icon icon="bell-outline"></nb-icon>
          @if (unreadCount) {
            <span class="notif-dot">{{ unreadCount }}</span>
          }
        </button>
        <nb-user
          [name]="auth.currentUser()?.name || 'Usuário'"
          [title]="getRoleName(auth.currentUser()?.role)"
          [color]="getPersonColor(auth.currentUser()?.id)"
          [nbContextMenu]="contextMenuItems"
          nbContextMenuTag="user-context-menu">
        </nb-user>
      </div>
    </div>
  </nb-layout-header>

  <nb-sidebar *ngIf="auth.isAuthenticated()" tag="menu" state="expanded" responsive compactedBreakpoint="lg" collapsedBreakpoint="sm">
    <nb-menu [items]="menu"></nb-menu>
  </nb-sidebar>

  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>

  <nb-layout-footer *ngIf="auth.isAuthenticated()" fixed>
    <div class="app-footer">
      Desenvolvido por <a href="https://www.linkedin.com/in/ramou1/" target="_blank" rel="noopener">Ramon Oliveira</a>
    </div>
  </nb-layout-footer>
</nb-layout>

<ng-template #notificationsTpl>
  <div class="notif-panel">
    <header>
      <strong>Notificações</strong>
      @if (unreadCount) {
        <button type="button" (click)="markNotificationsRead()">Marcar como lidas</button>
      }
    </header>
    @for (item of notifications; track item.id) {
      <article [class.unread]="!item.read">
        <p>{{ item.text }}</p>
        <small>{{ item.time }}</small>
      </article>
    } @empty {
      <p class="empty">Nenhuma notificação.</p>
    }
  </div>
</ng-template>
