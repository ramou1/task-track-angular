<nb-layout [class.auth-layout]="!auth.isAuthenticated()">
  <nb-layout-header *ngIf="auth.isAuthenticated()" fixed>
    <div class="header-bar">
      <div class="header-left">
        <button class="menu-toggle" nbButton ghost type="button" (click)="toggleSidebar()"
          [attr.aria-label]="sidebarCompact() ? 'Expandir menu' : 'Recolher menu'">
          <nb-icon icon="arrow-ios-back-outline" [class.is-compact]="sidebarCompact()"></nb-icon>
        </button>
        <button class="brand" type="button" (click)="goToHome()">
          <img src="assets/images/logo_task.png" alt="TaskTrack" class="logo_task">
          @if (auth.currentUser()?.workplace) {
            <span class="workspace-chip">{{ auth.currentUser()?.workplace }}</span>
          }
        </button>
      </div>

      <div class="header-right">
        <button class="notif-btn" nbButton ghost type="button"
          [nbPopover]="notificationsTpl" nbPopoverPlacement="bottom" nbPopoverTrigger="click"
          aria-label="Notificações">
          <nb-icon icon="bell-outline"></nb-icon>
          @if (unreadCount) {
            <span class="notif-dot">{{ unreadCount }}</span>
          }
        </button>
        <nb-user
          [name]="auth.currentUser()?.name || 'Usuário'"
          [title]="getRoleName(auth.currentUser()?.role)"
          [color]="getPersonColor(auth.currentUser()?.id)"
          [nbContextMenu]="contextMenuItems"
          nbContextMenuTag="user-context-menu">
        </nb-user>
      </div>
    </div>
  </nb-layout-header>

  <nb-sidebar *ngIf="auth.isAuthenticated()" class="app-sidebar" tag="menu"
    [state]="sidebarCompact() ? 'compacted' : 'expanded'"
    compactedBreakpoint="xs" collapsedBreakpoint="sm">
    @if (!sidebarCompact()) {
      <div class="sidebar-workspace">
        <nb-icon icon="briefcase-outline"></nb-icon>
        <div>
          <small>Local de trabalho</small>
          <strong>{{ auth.currentUser()?.workplace || 'TaskTrack' }}</strong>
        </div>
      </div>
    }
    <nb-menu [items]="menu"></nb-menu>
    <button class="sidebar-collapse" type="button" (click)="toggleSidebar()"
      [attr.aria-label]="sidebarCompact() ? 'Expandir menu' : 'Recolher menu'">
      <nb-icon [icon]="sidebarCompact() ? 'arrow-ios-forward-outline' : 'arrow-ios-back-outline'"></nb-icon>
      @if (!sidebarCompact()) {
        <span>Recolher menu</span>
      }
    </button>
  </nb-sidebar>

  <nb-layout-column>
    <div class="page-shell">
      <router-outlet></router-outlet>
    </div>
  </nb-layout-column>

  <nb-layout-footer *ngIf="auth.isAuthenticated()" fixed>
    <div class="app-footer">
      Desenvolvido por <a href="https://www.linkedin.com/in/ramou1/" target="_blank" rel="noopener">Ramon Oliveira</a>
    </div>
  </nb-layout-footer>
</nb-layout>

<ng-template #notificationsTpl>
  <div class="notif-panel">
    <header>
      <strong>Notificações</strong>
      @if (unreadCount) {
        <button type="button" (click)="markNotificationsRead()">Marcar como lidas</button>
      }
    </header>
    @for (item of notifications; track item.id) {
      <article [class.unread]="!item.read">
        <p>{{ item.text }}</p>
        <small>{{ item.time }}</small>
      </article>
    } @empty {
      <p class="empty">Nenhuma notificação.</p>
    }
  </div>
</ng-template>
